[project]
name = "rhea-fingraph"
version = "0.1.0"
description = "Temporal graph intelligence for merchant payment-fraud prevention."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "duckdb>=1.1,<2",
  "fastapi>=0.115,<1",
  "orjson>=3.10,<4",
  "polars>=1.20,<2",
  "pydantic-settings>=2.7,<3",
  "pydantic>=2.10,<3",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
graph = [
  "elasticsearch>=8.17,<9",
  "neo4j>=5.27,<6",
  "psycopg[binary]>=3.2,<4",
  "redis>=5.2,<6",
]
ml = [
  "catboost>=1.2,<2",
  "lightgbm>=4.5,<5",
  "scikit-learn>=1.6,<2",
  "shap>=0.46,<1",
  "torch>=2.5,<3",
  "torch-geometric>=2.6,<3",
  "xgboost>=2.1,<4",
]
baseline = ["scikit-learn>=1.6,<2"]
resilience = ["helix-agent-sdk>=0.2,<1"]
observability = [
  "arize-phoenix>=7,<9",
  "mlflow>=2.19,<4",
  "opentelemetry-api>=1.29,<2",
  "opentelemetry-sdk>=1.29,<2",
]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
rhea-profile = "fingraph_sentinel.dataset:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fingraph_sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
